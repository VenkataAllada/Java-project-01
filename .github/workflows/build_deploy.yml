name: Build and deploy
    
on: 
    workflow_dispatch:
permissions:
    id-token: write
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v3
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'

            - name: Java and Maven Version 
              run: |
                java -version
                mvn -version

            - name: Build with Maven
              run: mvn clean package

            - name: Verify build artifacts
              run: |
                ls -l target/*.jar
                echo "Build artifacts verified successfully."
                echo "Build process completed successfully."

            - name: Prepare EBS Package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/
                echo "web: java -jar *.jar" > eb-deployment/Procfile
                echo "EBS package prepared successfully."
                ls -la eb-deployment
                echo "EBS package preparation completed successfully."

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: streamflix-deployment
                path: eb-deployment
